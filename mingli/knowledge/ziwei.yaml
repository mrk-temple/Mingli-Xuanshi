# 紫微斗数 —— 知识库（knowledge-only：有知识、暂无可靠确定性算盘引擎）
# 规则等级 S=原典 / A=学术 / B=主流教材 / C=当代实践 / D=网络
# 安星诀版本差异（中州派 / 三合 / 飞星）在 disputes 并列，不强行调和。
rules:
  - id: ziwei/minggong-zhuxing
    systemId: ziwei
    tradition: mainstream
    statement: 命宫主星决定命主的基本气质与人生主轴；破军、七杀属开创型，机月同梁属机变随和型，紫府为守成贵气。
    keywords: [命宫, 主星, 命主]
    appliesTo: [self]
    sourceLevel: B
    source: 《紫微斗数全书》命宫总诀 / 中州派命宫论
    notes: 主星性质是性格与格局的总纲，断事仍需结合三方四正与四化。

  - id: ziwei/sanfang-sizheng
    systemId: ziwei
    tradition: mainstream
    statement: 命宫三方四正（命宫、财帛、官禄、迁移）构成人生成败的基本框架，断人事吉凶须看三方四正的宫星组合与对冲。
    keywords: [三方四正, 命宫, 财帛宫, 官禄宫, 迁移宫]
    appliesTo: [self, decision]
    sourceLevel: B
    source: 《中州派紫微斗数讲义》二、三方四正
    notes: 本平台只作框架性知识，不做"吉凶定论"式综合评分。

  - id: ziwei/sihua
    systemId: ziwei
    tradition: mainstream
    statement: 生年四化依生年天干而定：化禄主增益、化权主权力掌实、化科主名声清誉、化忌主执著与损耗；化入某宫则加重该宫事项。
    keywords: [四化, 化禄, 化权, 化科, 化忌, 生年天干]
    appliesTo: [career, finance, relationship]
    sourceLevel: B
    source: 生年四化表（《紫微斗数全书》）
    disputes:
      - 四化口诀因派别而异（中州派 / 三合 / 飞星对某些天干化曜归属不同），本知识库并列，不合并。

  - id: ziwei/daxian
    systemId: ziwei
    tradition: mainstream
    statement: 大限由命宫起，按五行局定起限岁数，阳男阴女顺行、阴男阳女逆行，每限十年，断阶段运程主事。
    keywords: [大限, 五行局, 起限]
    appliesTo: [self, timing]
    sourceLevel: B
    source: 《紫微斗数全书》大限起法
    notes: 起限岁数由五行局决定（火六局/土五局等），不同版本口径略有差异。

  - id: ziwei/zhuxing-kuangjia
    systemId: ziwei
    tradition: mainstream
    statement: 十四主星（紫微、天机、太阳、武曲、天同、廉贞、天府、太阴、贪狼、巨门、天相、天梁、七杀、破军）按开创/领导/支援/合作划分类型，组合决定行事风格。
    keywords: [十四主星, 紫微, 天机, 太阳, 武曲, 天同, 廉贞, 天府, 太阴, 贪狼, 巨门, 天相, 天梁, 七杀, 破军]
    appliesTo: [self]
    sourceLevel: A
    source: 主星类型诸家析论（《紫微斗数全书》+ 今人讲义）

  - id: ziwei/shiren-gong
    systemId: ziwei
    tradition: mainstream
    statement: 十二宫各主一类人事：命、兄弟、夫妻、子女、财帛、疾厄、迁移、交友、官禄、田宅、福德、父母；断事项按对应宫位取用。
    keywords: [十二宫, 命宫, 夫妻宫, 子女宫, 财帛宫, 官禄宫, 父母宫]
    appliesTo: [career, relationship, finance]
    sourceLevel: S
    source: 《紫微斗数全书》十二宫论
    disputes:
      - 宫位名称与主事随派别略有出入（如"交友/仆役"），知识库并列，不强行统一。

  - id: ziwei/fuqi-xian
    systemId: ziwei
    tradition: mainstream
    statement: 夫妻宫主婚姻感情，常与对宫官禄并看（夫官线）；吉凶视宫星、四化与煞星综合而定。
    keywords: [夫妻宫, 婚姻, 感情, 夫妻]
    appliesTo: [relationship]
    sourceLevel: B
    source: 《中州派紫微斗数讲义》三、夫官线
    notes: 本平台不把断语包装成确定结论，仅供框架对照。

  - id: ziwei/caiguan-xian
    systemId: ziwei
    tradition: mainstream
    statement: 财帛宫主财富，官禄宫主事业，二宫与命宫三方相照；断事业财运看官禄/财帛宫星曜与四化入宫。
    keywords: [财帛宫, 财运, 钱财, 官禄宫, 事业]
    appliesTo: [career, finance]
    sourceLevel: B
    source: 《紫微斗数全书》财帛宫 / 官禄宫论
